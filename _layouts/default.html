<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Test Cookbook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9b4dca" />
    <link rel="manifest" href="/manifest.json">
    <!-- Google Fonts -->
    <!--<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,300italic,700,700italic">-->

    <!-- CSS Reset -->
    <!--<link rel="stylesheet" href="https://cdn.rawgit.com/necolas/normalize.css/master/normalize.css">-->

    <!-- Milligram CSS minified -->
    <!--<link rel="stylesheet" href="https://cdn.rawgit.com/milligram/milligram/master/dist/milligram.min.css">-->

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/autumn.css">
  
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7T5Z2T0SZR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-7T5Z2T0SZR');
    </script>


    <script>
        function menutoggle() {
            var x = document.getElementById("sidemenu");
            var y = document.getElementById("content");
            if (x.style.display === 'none') {
                x.style.display = 'block';
                y.className = "column column-75";
            } else {
                x.style.display = 'none';
                y.className = "column column-100";
            }
        }

        function menu() {
            if (window.innerWidth >= 1024) {
                menutoggle();
            }
        }

        // Hide menu entries whose link text does not contain the query.
        // Section headers stay visible so the list keeps its structure.
        function filterMenu(query) {
            var q = query.trim().toLowerCase();
            var items = document.querySelectorAll('#sidemenu li:not(.header)');
            items.forEach(function (li) {
                var link = li.querySelector(':scope > a');
                if (!link) { return; }
                var match = q === '' || link.textContent.toLowerCase().indexOf(q) !== -1;
                // Keep a parent visible when one of its nested chapters matches.
                var nestedMatch = Array.prototype.some.call(
                    li.querySelectorAll('a'),
                    function (a) { return a.textContent.toLowerCase().indexOf(q) !== -1; });
                li.style.display = (match || nestedMatch) ? '' : 'none';
            });
        }
    </script>
</head>
<body onload="menu()">
<div class="container">
    <div class="row">
        <div class="column column-80">
            <h1><a href="/">Test Cookbook</a></h1>
        </div>
        <div class="column">
            <button onclick="menutoggle()">Menu</button>
        </div>
    </div>
</div>

<hr/>
<div class="container">
    <div class="row">
        <div id="sidemenu" class="sidemenu column" style="display: none;">
            <input type="search" id="menu-search" placeholder="Search chapters" aria-label="Search chapters"
                   oninput="filterMenu(this.value)" style="width: 100%;" />
            {% include menu.html %}
        </div>
        <div id="content" class="column column-100">
            {{ content }}
            {% if page.path %}
            <p class="edit-link">
                <a href="https://github.com/testcookbook/testcookbook.github.io/edit/master/{{ page.path }}"
                   target="_blank" rel="noopener">Edit this page on GitHub</a>
            </p>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
